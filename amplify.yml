version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - if [ "${AWS_BRANCH}" = "dev" ]; then npm run build -- --configuration=development; else npm run build; fi
      artifacts:
        baseDirectory: dist/shift-nook/browser
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customRules:
        - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
          target: /index.html
          status: '200'
    appRoot: .
