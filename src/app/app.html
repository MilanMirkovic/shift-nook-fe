<!-- Loading screen while checking authentication -->
@if (appInitializing()) {
  <div class="app-loading-screen">
    <div class="app-loading-content">
      <div class="app-loading-brand-mark">SN</div>
      <div class="app-loading-brand-name">Shift Nook</div>
      <mat-spinner diameter="36" class="app-loading-spinner"></mat-spinner>
    </div>
  </div>
}

<!-- Public pages (login, etc.) - no layout -->
<ng-container *ngIf="!appInitializing() && !showLayout()">
  <router-outlet></router-outlet>
</ng-container>

<!-- Authenticated pages - with sidebar layout -->
<ng-container *ngIf="!appInitializing() && showLayout()">
  <!-- Floating navigation handle (desktop only) -->
  @if (!isHandset()) {
    <button
      class="nav-edge-handle"
      mat-icon-button
      type="button"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="navOpen()"
      (click)="toggleNavigation()"
    >
      <mat-icon aria-hidden="true">
        {{ navOpen() ? 'chevron_left' : 'chevron_right' }}
      </mat-icon>
    </button>
  }

  <mat-sidenav-container class="app-shell" autosize>

    <!-- Side navigation -->
    <mat-sidenav
      class="app-sidenav"
      [class.is-collapsed]="!isHandset() && isCollapsed()"
      [mode]="sidenavMode()"
      [opened]="navOpen()"
      [fixedInViewport]="isHandset()"
      [fixedTopGap]="0"
    >
      <app-sidebar
        [appName]="appName"
        [isHandset]="isHandset()"
        [isCollapsed]="isCollapsed()"
        (linkClicked)="closeSidenavOnMobile()"
      />
    </mat-sidenav>

    <!-- Main content -->
    <mat-sidenav-content class="app-content">
      <mat-toolbar class="app-toolbar" color="primary">
        <!-- Mobile hamburger button -->
        @if (isHandset()) {
          <button
            mat-icon-button
            type="button"
            class="app-toolbar__menu-btn"
            aria-label="Open navigation"
            (click)="toggleNavigation()"
          >
            <mat-icon>menu</mat-icon>
          </button>
        }

        <div class="app-toolbar__brand" *ngIf="isHandset()">
          <span class="app-toolbar__brand-mark">SN</span>
          <span class="app-toolbar__brand-name">Shift Nook</span>
        </div>

        <span class="spacer"></span>
        <app-notification-bell />
      </mat-toolbar>

      <div class="page" [class.has-bottom-nav]="isHandset()">
        <router-outlet></router-outlet>
      </div>

      <!-- Check In FAB for workers -->
      <app-check-in-fab />

    </mat-sidenav-content>

  </mat-sidenav-container>
</ng-container>
