<div class="tab-content">
  <div class="empty-state">
    <mat-icon class="empty-state__icon">schedule</mat-icon>
    <h3 class="empty-state__title">No timesheets yet</h3>
    <p class="empty-state__description">Timesheets for {{ jobsite.name }} will appear here</p>
    <button mat-flat-button color="primary" (click)="onCreateTimesheet()">
      <mat-icon>add</mat-icon>
      Create Timesheet
    </button>
  </div>
</div>
