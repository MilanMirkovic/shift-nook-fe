<div class="dialog-container">
  <div class="dialog-header">
    <h2 mat-dialog-title>{{ title }}</h2>
    <button mat-icon-button (click)="onCancel()" class="close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <form [formGroup]="form" class="accountant-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email Address</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          placeholder="accountant@example.com"
          [readonly]="isEditMode"
        />
        <mat-icon matPrefix>email</mat-icon>
        <mat-error *ngIf="form.get('email')?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">
          Please enter a valid email
        </mat-error>
        <mat-hint *ngIf="!isEditMode">
          An invitation will be sent to this email
        </mat-hint>
      </mat-form-field>

      <div class="name-row">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>First Name</mat-label>
          <input
            matInput
            formControlName="firstName"
            placeholder="John"
          />
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Last Name</mat-label>
          <input
            matInput
            formControlName="lastName"
            placeholder="Doe"
          />
        </mat-form-field>
      </div>

      <div class="company-selection" *ngIf="showCompanySelection">
        <h3 class="section-title">Assign to Companies</h3>
        <p class="section-hint">Select which companies this accountant will have access to</p>

        <div class="company-list">
          <mat-checkbox
            *ngFor="let company of availableCompanies"
            [checked]="isCompanySelected(company.companyId)"
            (change)="onCompanyToggle(company.companyId, $event.checked)"
            class="company-checkbox"
          >
            {{ company.companyName }}
          </mat-checkbox>
        </div>
      </div>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button
      mat-raised-button
      color="primary"
      (click)="onSubmit()"
      [disabled]="!form.valid"
    >
      <mat-icon>{{ isEditMode ? 'save' : 'send' }}</mat-icon>
      {{ submitButtonText }}
    </button>
  </mat-dialog-actions>
</div>
