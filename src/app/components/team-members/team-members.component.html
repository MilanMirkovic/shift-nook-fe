<app-list-page
  title="Team"
  subtitle="Manage staff profiles, roles, and availability."
  [rows]="(members$ | async) ?? []"
  [columns]="columns"
  [actions]="actions"
  searchPlaceholder="Search team members"
  [pageSize]="20"
  [serverSidePagination]="true"
  [totalItems]="(total$ | async) ?? 0"
  [currentPage]="0"
  [pageChange]="onPageChange"
  [pageSizeChange]="onPageSizeChange"
  [queryChange]="onQueryChange"
  [clientSideSearch]="false"
  (rowClick)="onRowClick($event)"
>
  <ng-container pageActions>
    @if ((currentUserRole$ | async) === CompanyRole.OWNER) {
      <button mat-flat-button color="primary" type="button" (click)="openInviteDialog()">
        <mat-icon>person_add</mat-icon>
        Invite Member
      </button>
    }
  </ng-container>
</app-list-page>

@if ((currentUserRole$ | async) === CompanyRole.OWNER && (selectedCompanyId$ | async); as companyId) {
  <app-pending-invitations [companyId]="companyId"></app-pending-invitations>
}
