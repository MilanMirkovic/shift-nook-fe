@if (isOnboarding) {
  <div class="onboarding-banner">
    <div class="onboarding-banner__steps">
      <span class="step step--done"><mat-icon>check_circle</mat-icon> Company created</span>
      <mat-icon class="step-arrow">chevron_right</mat-icon>
      <span class="step step--active"><mat-icon>group_add</mat-icon> Invite your team</span>
      <mat-icon class="step-arrow">chevron_right</mat-icon>
      <span class="step step--upcoming">Start scheduling</span>
    </div>
    <button mat-stroked-button (click)="goToDashboard()">
      Skip for now
      <mat-icon iconSuffix>arrow_forward</mat-icon>
    </button>
  </div>
}

<app-list-page
  title="Team"
  subtitle="Manage staff profiles, roles, and availability."
  [rows]="(members$ | async) ?? []"
  [columns]="columns"
  [actions]="actions"
  searchPlaceholder="Search team members"
  [pageSize]="20"
  [serverSidePagination]="true"
  [totalItems]="(total$ | async) ?? 0"
  [currentPage]="0"
  [pageChange]="onPageChange"
  [pageSizeChange]="onPageSizeChange"
  [queryChange]="onQueryChange"
  [clientSideSearch]="false"
  (rowClick)="onRowClick($event)"
>
  <ng-container pageActions>
    <button mat-flat-button color="primary" type="button" (click)="openInviteDialog()">
      <mat-icon>person_add</mat-icon>
      Invite Member
    </button>
  </ng-container>
</app-list-page>

@if ((currentUserRole$ | async) === CompanyRole.OWNER && (selectedCompanyId$ | async); as companyId) {
  <app-pending-invitations [companyId]="companyId"></app-pending-invitations>
}
