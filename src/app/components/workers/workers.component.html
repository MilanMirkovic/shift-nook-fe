<app-list-page
  title="Workers"
  subtitle="Manage your workforce across all jobsites."
  [rows]="(members$ | async) ?? []"
  [columns]="columns"
  [actions]="actions"
  [searchable]="true"
  [clientSideSearch]="false"
  [queryChange]="onQueryChange"
  searchPlaceholder="Search workers"
  [pageSize]="10"
>
  <ng-template #pageActions>
    <button mat-flat-button color="primary" type="button" (click)="openInviteDialog()">Invite worker</button>
  </ng-template>
</app-list-page>
