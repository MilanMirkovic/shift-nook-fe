<div class="status-dialog">
  <div class="dialog-header">
    <mat-icon class="header-icon">swap_horiz</mat-icon>
    <div class="header-text">
      <h2 mat-dialog-title>Change Status</h2>
      <p class="subtitle">Estimate #{{ data.estimateNumber }} · {{ data.estimateTitle }}</p>
    </div>
    <button class="close-btn" mat-icon-button (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <!-- Revision warning when selecting SENT on a revised estimate -->
    <div *ngIf="data.revisionNumber > 0 && selectedStatus === 'SENT' && hasChanged" class="revision-warning">
      <mat-icon class="revision-warning__icon">info</mat-icon>
      <span>This estimate has been revised {{ data.revisionNumber }} time{{ data.revisionNumber !== 1 ? 's' : '' }}. Send revision {{ data.revisionNumber }} to client?</span>
    </div>

    <div class="status-options">
      <button
        *ngFor="let option of statusOptions"
        class="status-option"
        [class.status-option--selected]="selectedStatus === option.value"
        [class.status-option--current]="data.currentStatus === option.value"
        [ngClass]="option.colorClass"
        (click)="selectStatus(option.value)"
        type="button"
      >
        <div class="status-option__icon">
          <mat-icon>{{ option.icon }}</mat-icon>
        </div>
        <div class="status-option__text">
          <span class="status-option__label">{{ option.label }}</span>
          <span class="status-option__desc">{{ option.description }}</span>
        </div>
        <mat-icon *ngIf="selectedStatus === option.value" class="status-option__check">check</mat-icon>
        <span *ngIf="data.currentStatus === option.value" class="status-option__current-badge">Current</span>
      </button>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="!hasChanged"
      (click)="onConfirm()"
    >
      Update Status
    </button>
  </mat-dialog-actions>
</div>
