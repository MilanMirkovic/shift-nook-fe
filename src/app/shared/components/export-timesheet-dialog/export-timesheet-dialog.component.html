<div class="export-dialog">
  <div class="export-dialog__header">
    <div class="export-dialog__header-icon">
      <mat-icon>picture_as_pdf</mat-icon>
    </div>
    <div>
      <h2 mat-dialog-title>Export Timesheet PDF</h2>
      <p>Select a date range to generate the report.</p>
    </div>
  </div>

  <mat-dialog-content>
    <div class="export-dialog__fields">
      <mat-form-field appearance="outline">
        <mat-label>Date From</mat-label>
        <input matInput [matDatepicker]="fromPicker" [(ngModel)]="fromDate">
        <mat-datepicker-toggle matIconSuffix [for]="fromPicker"></mat-datepicker-toggle>
        <mat-datepicker #fromPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Date To</mat-label>
        <input matInput [matDatepicker]="toPicker" [(ngModel)]="toDate" [min]="fromDate">
        <mat-datepicker-toggle matIconSuffix [for]="toPicker"></mat-datepicker-toggle>
        <mat-datepicker #toPicker></mat-datepicker>
      </mat-form-field>
    </div>

    @if (fromDate && toDate && toDate < fromDate) {
      <p class="export-dialog__error">
        <mat-icon>error_outline</mat-icon>
        "Date To" must be after "Date From".
      </p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="!isValid"
      (click)="onExport()">
      <mat-icon>download</mat-icon>
      Download PDF
    </button>
  </mat-dialog-actions>
</div>
