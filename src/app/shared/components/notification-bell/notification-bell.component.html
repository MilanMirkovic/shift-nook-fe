<button
  mat-icon-button
  [matMenuTriggerFor]="notificationMenu"
  (menuOpened)="onMenuOpened()"
  (menuClosed)="onMenuClosed()"
  class="notification-bell-button"
  aria-label="Notifications"
>
  <mat-icon
    [matBadge]="getBadgeValue()"
    [matBadgeHidden]="unreadCount === 0"
    matBadgeColor="warn"
    matBadgeSize="small"
  >
    notifications
  </mat-icon>
</button>

<mat-menu #notificationMenu="matMenu" class="notification-menu" xPosition="before">
  <div class="notification-header" (click)="$event.stopPropagation()">
    <span class="notification-title">Notifications</span>
    <button
      *ngIf="unreadCount > 0"
      mat-button
      color="primary"
      class="mark-all-read-btn"
      (click)="onMarkAllAsRead($event)"
    >
      Mark all as read
    </button>
  </div>

  <mat-divider></mat-divider>

  <div class="notification-list" (click)="$event.stopPropagation()">
    <!-- Loading dots -->
    <div *ngIf="loading && notifications.length === 0" class="loading-container">
      <div class="sn-dots"><span></span><span></span><span></span></div>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && notifications.length === 0" class="empty-state">
      <div class="empty-icon"><mat-icon>notifications_none</mat-icon></div>
      <p>No notifications yet</p>
    </div>

    <!-- Notification items -->
    <div
      *ngFor="let notification of notifications; trackBy: trackById"
      class="notification-item"
      [class.unread]="!notification.read"
      (click)="onNotificationClick(notification, $event)"
    >
      <div class="notification-icon" [ngClass]="getIconClass(notification.type)">
        <mat-icon>{{ getNotificationIcon(notification.type) }}</mat-icon>
      </div>
      <div class="notification-content">
        <span class="notification-item-title">{{ notification.title }}</span>
        <span class="notification-message">{{ notification.message }}</span>
        <span class="notification-time">{{ getTimeAgo(notification.createdAt) }}</span>
      </div>
      <div *ngIf="!notification.read" class="unread-indicator"></div>
    </div>

    <!-- Load more button -->
    <div *ngIf="hasMore && !loading" class="load-more-container">
      <button mat-button color="primary" (click)="onLoadMore($event)">
        Load more
      </button>
    </div>

    <!-- Loading more spinner -->
    <div *ngIf="loading && notifications.length > 0" class="loading-more">
      <mat-spinner diameter="24"></mat-spinner>
    </div>
  </div>

  <mat-divider></mat-divider>

  <!-- View all link -->
  <div class="view-all-container" (click)="onViewAll($event)">
    <button mat-button color="primary" class="view-all-btn">
      View all notifications
    </button>
  </div>
</mat-menu>
