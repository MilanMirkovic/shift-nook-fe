<div class="stop-session-dialog">
  <div class="dialog-header dialog-header--warning">
    <mat-icon class="dialog-icon">{{ dialogIcon }}</mat-icon>
    <h2 mat-dialog-title class="dialog-title">{{ dialogTitle }}</h2>
  </div>

  <mat-dialog-content class="dialog-content">
    <p class="dialog-message" [innerHTML]="dialogMessage"></p>

    <form [formGroup]="form" class="description-form">
      <div class="form-field">
        <label class="field-label">Session Description (Optional)</label>
        <mat-form-field appearance="outline">
          <textarea matInput
                    formControlName="description"
                    placeholder="Add a brief note about your work on this session..."
                    rows="3"></textarea>
        </mat-form-field>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button mat-button (click)="onCancel()" type="button">
      Cancel
    </button>
    <button
      mat-flat-button
      color="primary"
      (click)="onConfirm()"
      type="button"
    >
      {{ confirmButtonText }}
    </button>
  </mat-dialog-actions>
</div>
